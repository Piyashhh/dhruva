name: Build Dhruva APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Wrap the web app in an Android shell
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          echo '{"appId":"app.dhruva","appName":"Dhruva","webDir":"www","server":{"androidScheme":"http","cleartext":true},"android":{"adjustMarginsForEdgeToEdge":"force"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dhruva (latest build)
          files: android/app/build/outputs/apk/debug/app-debug.apk
