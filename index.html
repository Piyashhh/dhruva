<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=color-scheme content="dark light"><title>Dhruva</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{--bg:#000;--cd:#1c1c1e;--tx:#f5f5f7;--t2:#9a9aa0;--ac:#ffc247;--gl:#1c1c1ecc;font:100%/1.45 system-ui,sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#f2f2f7;--cd:#fff;--tx:#111;--t2:#6c6c70;--ac:#f0a500;--gl:#fffffff0}}
html,body{height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
#v{height:100%;overflow-y:auto;padding:max(1rem,env(safe-area-inset-top)) 1rem 9rem;overscroll-behavior:contain}
#v.in>*{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1{font-size:2.2rem;line-height:1.05;letter-spacing:-.03em;margin:.2rem 0 .9rem}
h2{font-size:1.3rem;letter-spacing:-.015em;margin:.2rem 0 .8rem}
.t2{color:var(--t2);font-size:.9rem;letter-spacing:.01em}
.c{background:var(--cd);border-radius:1.1rem;padding:.9rem 1rem;margin-bottom:.6rem;transition:transform .1s}
.c:active,.b:active,#tabs button:active{transform:scale(.97)}
.b{background:var(--ac);color:#1a1200;border:0;border-radius:99px;padding:.6rem 1.1rem;font:600 1rem system-ui;transition:transform .1s}
.b.g{background:var(--cd);color:var(--tx)}
input,textarea{width:100%;background:var(--cd);color:var(--tx);border:0;border-radius:.9rem;padding:.7rem .9rem;font:inherit;outline:0;margin-bottom:.6rem}
#bot{position:fixed;left:0;right:0;bottom:0;background:var(--gl);backdrop-filter:blur(24px) saturate(180%);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #ffffff1f;z-index:3}
#inp{display:flex;gap:.5rem;padding:.6rem .8rem 0}#inp input{margin:0}
#tabs{display:flex}#tabs button{flex:1;background:0;border:0;color:var(--t2);font:600 .85rem system-ui;letter-spacing:.02em;padding:.9rem 0;transition:transform .1s}
#tabs .on{color:var(--ac)}
.m{max-width:88%;width:fit-content;padding:.6rem .85rem;border-radius:1.1rem;margin:.4rem 0;white-space:pre-wrap}
.u{margin-left:auto;background:var(--ac);color:#1a1200}.a{background:var(--cd)}
.row{display:flex;gap:.6rem;align-items:center}
.dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#888;margin-right:.4rem}.dot.on{background:#30d158}
.ck{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--t2);flex:none;transition:all .15s}.ck.on{background:var(--ac);border-color:var(--ac)}
.fab{position:fixed;right:1rem;bottom:5.5rem;box-shadow:0 6px 20px #0006}
.foc{border:1px solid var(--ac)}.dim{opacity:.45}
label.row{padding:.35rem 0}label input{width:auto;margin:0}
#scrim{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;z-index:4}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;background:var(--gl);backdrop-filter:blur(30px) saturate(180%);border-radius:1.5rem 1.5rem 0 0;box-shadow:0 -12px 40px #0007;border-top:1px solid #ffffff22;z-index:5;transform:translateY(100vh);will-change:transform}
.grab{padding:.7rem;touch-action:none}.grab i{display:block;width:2.5rem;height:.3rem;border-radius:9px;background:var(--t2);margin:auto;opacity:.6}
#sb{overflow-y:auto;padding:0 1rem calc(1rem + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:6rem;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--cd);padding:.6rem 1rem;border-radius:99px;z-index:6;transition:.25s;white-space:nowrap;box-shadow:0 6px 24px #0007}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{background:0;border:0;color:var(--ac);font:600 1rem system-ui;margin-left:.6rem}
@media(prefers-reduced-motion:reduce){#v.in>*{animation:none}*{transition:none!important}}
@media(prefers-reduced-transparency:reduce){#bot,#sheet{background:var(--cd);backdrop-filter:none}}
@media(prefers-contrast:more){#bot,#sheet{border-color:var(--tx)}.t2{color:var(--tx)}}
</style></head><body>
<main id=v></main>
<div id=bot><form id=inp><input id=q placeholder="Ask anything" autocomplete=off><button class=b>↑</button></form><nav id=tabs></nav></div>
<div id=scrim onclick=shut()></div>
<div id=sheet><div class=grab><i></i></div><div id=sb></div></div>
<div id=toast></div>
<script>
const $=s=>document.querySelector(s),H=screen.height,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=n=>navigator.vibrate&&navigator.vibrate(n||8);
let S={notes:[],tasks:[],chat:[],prof:{},ck:{},url:'http://127.0.0.1:8080'};
try{Object.assign(S,JSON.parse(localStorage.dhruva))}catch{}
const save=()=>localStorage.dhruva=JSON.stringify(S);
let tab='ask',on=0,busy=0,nq='',sy=H,cancel,onClose;
const TABS={ask:'Ask',notes:'Notes',today:'Today',prep:'Prepare'};
const CK=['Power bank charged','Offline maps downloaded','7 days of regular medicines','ID & documents photographed','Some cash in small notes','Torch + spare batteries','Water + ORS','Emergency numbers on paper'];
const F=[['name','Name'],['blood','Blood group'],['allergy','Allergies'],['meds','Medicines'],['contact','Emergency contact'],['note','Anything else']];

/* spring: response r (s), damping ratio z. Starts from the live value + velocity, so it is always interruptible */
function spring(x,to,v,{r=.38,z=1},cb,done){if(RM){cb(to);done&&done();return()=>{}}
 const w=2*Math.PI/r;let t0=performance.now(),id;
 const f=t=>{const dt=Math.min((t-t0)/1000,.032);t0=t;v+=(-w*w*(x-to)-2*z*w*v)*dt;x+=v*dt;cb(x);
  if(Math.abs(v)<.5&&Math.abs(x-to)<.5){cb(to);done&&done();return}id=requestAnimationFrame(f)};
 id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id)}
const rb=(o,d=300,c=.55)=>o*d*c/(d+c*o);
function put(y){sy=y;$('#sheet').style.transform=`translateY(${y}px)`;const s=$('#scrim');s.style.opacity=Math.max(0,1-y/H*1.6);s.style.pointerEvents=y<H*.7?'auto':'none'}
const go=(to,v=0,z=1,done)=>{cancel&&cancel();cancel=spring(sy,to,v,{z},put,done)};
function sheet(html,fn){onClose=fn;$('#sb').innerHTML=html;go(0)}
function shut(){document.activeElement.blur();go(H,0,1,()=>{const f=onClose;onClose=null;f&&f()})}
{const g=$('.grab');let d0=null,h=[];
 g.onpointerdown=e=>{cancel&&cancel();g.setPointerCapture(e.pointerId);d0=e.clientY-sy;h=[[e.timeStamp,e.clientY]]};
 g.onpointermove=e=>{if(d0==null)return;h=[...h,[e.timeStamp,e.clientY]].slice(-5);const y=e.clientY-d0;put(y<0?-rb(-y):y)};
 g.onpointerup=g.onpointercancel=e=>{if(d0==null)return;d0=null;const a=h[0],b=h[h.length-1],v=b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0])*1000:0;
  const end=sy+(v/1000)*.998/.002; /* project momentum */
  end>H*.45?shut():go(0,v,.8)}}

function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?'<button id=ud>Undo</button>':'');t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),5000);
 if(undo)$('#ud').onclick=()=>{undo();t.classList.remove('on');buzz()}}

/* local brain */
const pill=()=>document.querySelectorAll('.st').forEach(e=>e.innerHTML=`<i class="dot ${on?'on':''}"></i>${on?'Local brain online':'Local brain asleep'}`);
async function ping(){try{on=(await fetch(S.url+'/health',{signal:AbortSignal.timeout(2500)})).ok?1:0}catch{on=0}pill()}
const recall=q=>{const w=q.toLowerCase().match(/\w{3,}/g)||[];return S.notes.map(n=>({n,s:w.filter(x=>(n.t+n.b).toLowerCase().includes(x)).length})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.n)};
const paint=m=>{const e=$('#chat')?.lastElementChild;if(e){e.textContent=m.c||'…';$('#v').scrollTop=1e9}};
async function ask(q){busy=1;S.chat.push({r:'user',c:q});const m={r:'assistant',c:''};S.chat.push(m);render();
 const cx=recall(q);
 const msgs=[{role:'system',content:"You are Dhruva, a private assistant running fully on the user's phone. Be concise, practical, and say so when unsure."+(cx.length?"\nThe user's notes (use if relevant):\n"+cx.map(n=>`- ${n.t}: ${n.b.slice(0,600)}`).join('\n'):'')},...S.chat.slice(-9,-1).map(x=>({role:x.r,content:x.c}))];
 try{const r=await fetch(S.url+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,stream:true,temperature:.6})});
  if(!r.ok)throw 0;const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
   for(const l of ls)if(l.startsWith('data: {')){m.c+=JSON.parse(l.slice(6)).choices?.[0]?.delta?.content||'';paint(m)}}}
  on=1}catch{on=0;m.c=cx.length?"The local brain is asleep — here’s what your notes say:\n\n"+cx.map(n=>`• ${n.t}\n${n.b.slice(0,300)}`).join('\n\n'):"The local brain is asleep. Open Termux, run  dhruva  and ask again."}
 S.chat=S.chat.slice(-40);busy=0;save();render()}

/* views */
const nl=()=>{const q=nq.toLowerCase(),L=S.notes.filter(n=>(n.t+n.b).toLowerCase().includes(q));
 return L.map(n=>`<div class=c data-a=note data-i=${n.id}><b>${esc(n.t||'Untitled')}</b><div class=t2>${esc(n.b.slice(0,90))}</div></div>`).join('')||'<p class=t2>Nothing here yet. Capture a thought with the button below.</p>'};
const V={
ask:()=>`<h1>Ask</h1><div class="t2 st"></div><div id=chat>${S.chat.map(m=>`<div class="m ${m.r=='user'?'u':'a'}">${esc(m.c)||'…'}</div>`).join('')||'<p class=t2 style="margin-top:1rem">Private and on-device. I use your notes as memory — try “what did I decide about…?”</p>'}</div>`,
notes:()=>`<h1>Notes</h1><input id=nq placeholder="Search ${S.notes.length} notes" value="${esc(nq)}"><div id=nl>${nl()}</div><button class="b fab" data-a=new>+ Note</button>`,
today:()=>{const o=S.tasks.filter(t=>!t.d),d=S.tasks.filter(t=>t.d),row=t=>`<div class="c row ${t.d?'dim':''}" data-a=tg data-i=${t.id}><span class="ck ${t.d?'on':''}"></span>${esc(t.t)}</div>`;
 return `<div class=t2>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Today</h1><form id=tf><input id=ti placeholder="Add a task" autocomplete=off></form>${o[0]?`<div class="c foc"><div class=t2>DO THIS FIRST</div><b>${esc(o[0].t)}</b></div>`:''}${o.map(row).join('')}${d.map(row).join('')}`},
prep:()=>`<h1>Prepare</h1>
<div class=c data-a=eid><b>Emergency card</b><div class=t2>Blood group, allergies, contacts — stored only on this phone.</div></div>
<div class=c><b>Go-bag checklist</b>${CK.map((x,i)=>`<label class=row><input type=checkbox data-a=ck data-i=${i} ${S.ck[i]?'checked':''}> ${x}</label>`).join('')}</div>
<div class=c><b>Local brain</b><div class="t2 st"></div><input id=url value="${esc(S.url)}" style="margin-top:.6rem"><div class=t2>Start it in Termux by typing <b>dhruva</b></div></div>
<div class=c><b>Backup</b><div class=t2 style="margin-bottom:.6rem">No account, no cloud — your data is one block of JSON.</div><div class=row><button class=b data-a=bk>Copy backup</button><button class="b g" data-a=rs>Restore</button></div></div>`};

function render(){$('#v').innerHTML=V[tab]();$('#tabs').innerHTML=Object.entries(TABS).map(([k,l])=>`<button data-a=tab data-i=${k} class="${k==tab?'on':''}">${l}</button>`).join('');
 $('#inp').style.display=tab=='ask'?'flex':'none';if(tab=='ask')$('#v').scrollTop=1e9;pill()}

function editor(id){let gone=0;const n=S.notes.find(x=>x.id==id)||{id:Date.now(),t:'',b:''};
 sheet(`<input id=et placeholder=Title value="${esc(n.t)}"><textarea id=eb rows=9 placeholder="Write anything…">${esc(n.b)}</textarea><div class=row><button class="b g" id=dl>Delete</button><button class=b onclick=shut()>Done</button></div>`,()=>{
  if(!gone){const t=$('#et').value.trim(),b=$('#eb').value.trim(),i=S.notes.findIndex(x=>x.id==n.id);
   if(t||b){const m={id:n.id,t,b,ts:t!=n.t||b!=n.b||!n.ts?Date.now():n.ts};i<0?S.notes.unshift(m):S.notes[i]=m}else if(i>=0)S.notes.splice(i,1)}
  S.notes.sort((a,b)=>b.ts-a.ts);save();render()});
 $('#dl').onclick=()=>{gone=1;S.notes=S.notes.filter(x=>x.id!=n.id);shut();toast('Note deleted',()=>{S.notes.push(n);S.notes.sort((a,b)=>b.ts-a.ts);save();render()})}}
function card(){sheet('<h2>Emergency card</h2>'+F.map(([k,l])=>`<div class=t2>${l}</div><input data-k=${k} value="${esc(S.prof[k]||'')}">`).join('')+'<button class=b onclick=shut()>Done</button>',()=>{document.querySelectorAll('#sb [data-k]').forEach(i=>S.prof[i.dataset.k]=i.value);save()})}
function restore(){sheet('<h2>Restore backup</h2><textarea id=rt rows=8 placeholder="Paste your backup here"></textarea><button class=b id=rg>Restore</button>');
 $('#rg').onclick=()=>{try{const o=S;S=Object.assign({},S,JSON.parse($('#rt').value));save();shut();render();toast('Restored',()=>{S=o;save();render()})}catch{toast('That isn’t a valid backup')}}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const k=el.dataset.a,i=el.dataset.i;
 if(k=='tab'){tab=i;render();const v=$('#v');v.scrollTop=0;v.classList.remove('in');void v.offsetWidth;v.classList.add('in')}
 else if(k=='new')editor();else if(k=='note')editor(i);
 else if(k=='tg'){const t=S.tasks.find(x=>x.id==i);t.d=t.d?0:1;buzz();save();render()}
 else if(k=='ck'){S.ck[i]=el.checked;save()}
 else if(k=='eid')card();else if(k=='rs')restore();
 else if(k=='bk')navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup copied — paste it somewhere safe'),()=>toast('Copy failed'))});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id=='nq'){nq=t.value;$('#nl').innerHTML=nl()}
 if(t.id=='url'){S.url=t.value.trim().replace(/\/$/,'');save();ping()}});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id=='inp'){const q=$('#q').value.trim();if(q&&!busy){$('#q').value='';buzz();ask(q)}}
 if(e.target.id=='tf'){const v=$('#ti').value.trim();if(v){S.tasks.unshift({id:Date.now(),t:v,d:0});save();render();$('#ti').focus()}}});
put(H);render();ping();setInterval(ping,15000);
</script></body></html>
